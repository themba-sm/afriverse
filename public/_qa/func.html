<!doctype html><meta charset="utf-8"><title>func</title>
<body style="font:13px monospace;margin:8px"><pre id="o">running</pre>
<script>
const o=document.getElementById('o'),L=[];const log=s=>{L.push(s);o.textContent=L.join('\n')};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const f=document.createElement('iframe');f.style.cssText='width:390px;height:700px;border:1px solid #000';document.body.appendChild(f);
const W=()=>f.contentWindow, D=()=>f.contentDocument;
const load=async(u)=>{f.src=u;await new Promise(r=>{f.onload=r});await sleep(1300);
  W().addEventListener('error',e=>errs.push(e.message));};
const errs=[];const cls=[];
(async()=>{
 await load('/?f=1'); D().documentElement.style.scrollBehavior='auto';
 // layout shift observer
 try{new W().PerformanceObserver(l=>l.getEntries().forEach(e=>{if(!e.hadRecentInput)cls.push(e.value)})).observe({type:'layout-shift',buffered:true})}catch(e){}
 await sleep(800);
 // 1 nav links
 const hdr=[...D().querySelectorAll('.nav-desktop a, .mobile-menu a')].map(a=>a.getAttribute('href'));
 log('1 nav hrefs: '+[...new Set(hdr)].join(' '));
 // mobile menu opens and is inside viewport
 D().querySelector('.menu-toggle').click(); await sleep(400);
 const mm=D().querySelector('#mobile-menu').getBoundingClientRect();
 log('2 mobile menu rect L'+Math.round(mm.left)+' R'+Math.round(mm.right)+' vw='+D().documentElement.clientWidth+' (must be 0..vw)');
 D().querySelector('.menu-toggle').click(); await sleep(200);
 // 3 every industry card links to its page
 const cards=[...D().querySelectorAll('.industry')];
 log('3 industry cards='+cards.length+' hrefs='+cards.map(c=>c.querySelector('a').getAttribute('href').replace('#/industry/','')).join(','));
 // 4 pricing CTA passes plan (+industry) into the form
 const ev=[];W().addEventListener('afriverse:plan',e=>ev.push(e.detail));
 const planBtn=D().querySelectorAll('.plan .btn')[1]; planBtn.click(); await sleep(900);
 log('4 plan CTA event: '+JSON.stringify(ev[0]));
 const planSel=D().querySelector('#f-plan'); const indSel=D().querySelector('#f-industry');
 log('5 form plan="'+(planSel&&planSel.value)+'" industry="'+(indSel&&indSel.value)+'"');
 // 6 industry page: CTA passes industry; pricing reused
 await load('/?f=2#/industry/automotive'); D().documentElement.style.scrollBehavior='auto';
 const ev2=[];W().addEventListener('afriverse:plan',e=>ev2.push(e.detail));
 log('6 industry page h1="'+D().querySelector('h1').textContent.slice(0,40)+'" crumbs="'+(D().querySelector('.crumbs')||{}).textContent+'" pricing sections='+D().querySelectorAll('#plans').length);
 D().querySelectorAll('.plan .btn')[2].click(); await sleep(900);
 log('7 industry plan CTA event: '+JSON.stringify(ev2[0]));
 log('8 form industry="'+(D().querySelector('#f-industry')||{}).value+'" plan="'+(D().querySelector('#f-plan')||{}).value+'"');
 // 9 back-link to all industries
 const back=[...D().querySelectorAll('.crumbs a')].map(a=>a.getAttribute('href'));
 log('9 breadcrumb links: '+back.join(' '));
 // 10 form validation shows errors (no network call)
 D().querySelector('#contact-form-card form button[type=submit]').click(); await sleep(500);
 log('10 empty-submit error count='+D().querySelectorAll('.field__error').length+' (must be >0)');
 log('11 CLS entries='+cls.length+' sum='+cls.reduce((a,b)=>a+b,0).toFixed(4)+' | js errors='+errs.length);
 log('DONE');document.title='DONE'})();
</script>
