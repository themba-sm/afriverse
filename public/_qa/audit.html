<!doctype html><meta charset="utf-8"><title>qa</title>
<body style="font:12px monospace;background:#fff;color:#000;margin:8px"><pre id="out">starting</pre>
<script>
const q=new URLSearchParams(location.search);
const widths=(q.get('w')||'320,360,375,390,430,768,1024,1440').split(',').map(Number);
const routes=['','#/industry/real-estate','#/industry/legal','#/industry/construction','#/industry/professional','#/industry/salon','#/industry/fitness','#/industry/automotive','#/industry/fashion','#/industry/barber','#/industry/hospitality'];
const out=document.getElementById('out');const lines=[];const log=s=>{lines.push(s);out.textContent=lines.join('\n')};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function measure(win){const d=win.document,vw=d.documentElement.clientWidth;const off=[];
 d.querySelectorAll('body *').forEach(el=>{const r=el.getBoundingClientRect();if(!r.width||!r.height)return;
  if(r.right>vw+1||r.left<-1){let p=el.parentElement,clip=false;while(p&&p!==d.body){const cs=win.getComputedStyle(p);if(/(hidden|clip)/.test(cs.overflowX)){const pr=p.getBoundingClientRect();if(pr.right<=vw+1&&pr.left>=-1){clip=true;break}}p=p.parentElement}
  if(!clip&&win.getComputedStyle(el).position!=='fixed')off.push(el.tagName+'.'+String(typeof el.className==='string'?el.className:'').slice(0,40)+' L'+Math.round(r.left)+' R'+Math.round(r.right))}});
 return {vw,sw:d.documentElement.scrollWidth,bw:d.body.scrollWidth,off:off.slice(0,5)}}
(async()=>{let bad=0,n=0;
for(const w of widths){
 const f=document.createElement('iframe');f.style.cssText=`width:${w}px;height:700px;border:0;position:absolute;left:0;top:0;visibility:hidden`;document.body.appendChild(f);
 for(const r of routes){
  f.src='/?qa='+w+'_'+n+r; await new Promise(res=>{f.onload=res;setTimeout(res,6000)}); await sleep(400);
  const win=f.contentWindow;try{
   const h=win.document.documentElement.scrollHeight;for(let y=0;y<h;y+=900){win.scrollTo(0,y);await sleep(15)}
   const m=measure(win);n++;if(m.sw>m.vw||m.off.length){bad++;log(`FAIL w=${w} ${r||'/'} vw=${m.vw} sw=${m.sw} ${JSON.stringify(m.off)}`)}
  }catch(e){log('ERR '+w+' '+r+' '+e.message)}}
 log('width '+w+' checked ('+routes.length+' pages)');f.remove()}
log('DONE checked='+n+' failures='+bad);document.title='DONE'})();
</script>
